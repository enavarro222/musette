<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" role="img" aria-labelledby="title">
<title id="title">Fetching rides: a ride is acknowledged only once verified and stored</title>
<style>
  svg { --bg:#ffffff; --ink:#15171a; --muted:#5e636b; --line:#9aa0a6; --zone:#f4f5f2; --box:#ffffff; --accent:#0b6e69; --shared:#c2701f; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
  @media (prefers-color-scheme: dark) { svg { --bg:#111315; --ink:#eceeef; --muted:#a3a8ae; --line:#6b7178; --zone:#1b1e21; --box:#24282c; --accent:#3fb5ad; --shared:#e9a050; } }
  .bg { fill: var(--bg); }
  .zone { fill: var(--zone); stroke: var(--line); stroke-width: 1; }
  .sub { fill: none; stroke: var(--line); stroke-dasharray: 4 3; }
  .shared { fill: none; stroke: var(--shared); stroke-width: 1.5; stroke-dasharray: 6 3; }
  .box { fill: var(--box); stroke: var(--line); }
  .key { fill: var(--box); stroke: var(--accent); stroke-width: 2; }
  .ext { fill: var(--zone); stroke: var(--line); stroke-dasharray: 2 2; }
  .zl { fill: var(--muted); font-size: 13px; font-weight: 600; }
  .t { fill: var(--ink); font-size: 14px; font-weight: 600; }
  .s { fill: var(--muted); font-size: 11.5px; }
  .v { fill: var(--accent); font-size: 11.5px; font-weight: 600; }
  .sl { fill: var(--shared); font-size: 12px; font-weight: 600; }
  .n { fill: var(--muted); font-size: 12px; }
  .a { stroke: var(--accent); stroke-width: 1.6; fill: none; marker-end: url(#arr); }
  .ad { stroke: var(--shared); stroke-width: 1.6; fill: none; marker-end: url(#arrs); stroke-dasharray: 5 3; }
  .h { fill: var(--accent); }
  .hs { fill: var(--shared); }
</style>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="h" d="M0 0 10 5 0 10z"/></marker>
<marker id="arrm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path style="fill:var(--muted)" d="M0 0 10 5 0 10z"/></marker>
</defs>
<rect class="bg" width="1000" height="660"/>
<rect class="box" x="20" y="30" width="160" height="50" rx="9"/>
<text class="t" x="100" y="52" text-anchor="middle">Sorties screen</text>
<text class="s" x="100" y="69" text-anchor="middle">screens/Activities</text>
<line x1="100" y1="80" x2="100" y2="570" style="stroke:var(--line);stroke-dasharray:3 4"/>
<rect class="box" x="220" y="30" width="160" height="50" rx="9"/>
<text class="t" x="300" y="52" text-anchor="middle">Sync</text>
<text class="s" x="300" y="69" text-anchor="middle">lib/sync.ts</text>
<line x1="300" y1="80" x2="300" y2="570" style="stroke:var(--line);stroke-dasharray:3 4"/>
<rect class="box" x="430" y="30" width="160" height="50" rx="9"/>
<text class="t" x="510" y="52" text-anchor="middle">Device driver</text>
<text class="s" x="510" y="69" text-anchor="middle">lib/devices + Rust (fit)</text>
<line x1="510" y1="80" x2="510" y2="570" style="stroke:var(--line);stroke-dasharray:3 4"/>
<rect class="box" x="630" y="30" width="160" height="50" rx="9"/>
<text class="t" x="710" y="52" text-anchor="middle">Storage</text>
<text class="s" x="710" y="69" text-anchor="middle">lib/storage</text>
<line x1="710" y1="80" x2="710" y2="570" style="stroke:var(--line);stroke-dasharray:3 4"/>
<rect class="ext" x="820" y="30" width="160" height="50" rx="9"/>
<text class="t" x="900" y="52" text-anchor="middle">Bike computer</text>
<text class="s" x="900" y="69" text-anchor="middle">CC600, Bryton</text>
<line x1="900" y1="80" x2="900" y2="570" style="stroke:var(--line);stroke-dasharray:3 4"/>
<line class="a" x1="104" y1="115" x2="296" y2="115" style="" marker-end="url(#arr)"/>
<text class="v" x="200.0" y="108" text-anchor="middle">syncActivities()</text>
<circle cx="118" cy="104" r="9" style="fill:var(--accent)"/><text x="118" y="108" text-anchor="middle" style="fill:var(--bg);font-size:11px;font-weight:700">1</text>
<line class="a" x1="304" y1="165" x2="506" y2="165" style="" marker-end="url(#arr)"/>
<text class="v" x="405.0" y="158" text-anchor="middle">listActivities()</text>
<circle cx="318" cy="154" r="9" style="fill:var(--accent)"/><text x="318" y="158" text-anchor="middle" style="fill:var(--bg);font-size:11px;font-weight:700">2</text>
<line class="a" x1="514" y1="195" x2="896" y2="195" style="" marker-end="url(#arr)"/>
<text class="v" x="705.0" y="188" text-anchor="middle">asks for the ride list</text>
<line class="" x1="896" y1="222" x2="514" y2="222" style="stroke:var(--muted);stroke-width:1.3;stroke-dasharray:5 3;fill:none" marker-end="url(#arrm)"/>
<text class="s" x="705.0" y="215" text-anchor="middle">ids, start times</text>
<line class="a" x1="304" y1="268" x2="706" y2="268" style="" marker-end="url(#arr)"/>
<text class="v" x="505.0" y="261" text-anchor="middle">has(model:id)? → skip rides already kept</text>
<circle cx="318" cy="257" r="9" style="fill:var(--accent)"/><text x="318" y="261" text-anchor="middle" style="fill:var(--bg);font-size:11px;font-weight:700">3</text>
<rect x="190" y="292" width="790" height="250" rx="8" style="fill:none;stroke:var(--line)"/>
<rect x="190" y="292" width="150" height="22" rx="8" style="fill:var(--zone);stroke:var(--line)"/><text class="zl" x="202" y="308" style="font-size:12px">for each new ride</text>
<line class="a" x1="304" y1="345" x2="506" y2="345" style="" marker-end="url(#arr)"/>
<text class="v" x="405.0" y="338" text-anchor="middle">downloadActivity(ride)</text>
<circle cx="318" cy="334" r="9" style="fill:var(--accent)"/><text x="318" y="338" text-anchor="middle" style="fill:var(--bg);font-size:11px;font-weight:700">4</text>
<line class="a" x1="514" y1="375" x2="896" y2="375" style="" marker-end="url(#arr)"/>
<text class="v" x="705.0" y="368" text-anchor="middle">reads the FIT file (resumable)</text>
<rect x="415" y="392" width="190" height="44" rx="7" class="key"/>
<text class="t" x="510" y="410" text-anchor="middle" style="font-size:12.5px">verifyFit: header + CRC</text>
<text class="s" x="510" y="427" text-anchor="middle">bad file → throws, loop stops</text>
<line class="a" x1="304" y1="470" x2="706" y2="470" style="" marker-end="url(#arr)"/>
<text class="v" x="505.0" y="463" text-anchor="middle">put(ride): kept on this device</text>
<circle cx="318" cy="459" r="9" style="fill:var(--accent)"/><text x="318" y="463" text-anchor="middle" style="fill:var(--bg);font-size:11px;font-weight:700">5</text>
<line class="a" x1="304" y1="505" x2="506" y2="505" style="" marker-end="url(#arr)"/>
<text class="v" x="405.0" y="498" text-anchor="middle">acknowledgeActivity(ride)</text>
<circle cx="318" cy="494" r="9" style="fill:var(--accent)"/><text x="318" y="498" text-anchor="middle" style="fill:var(--bg);font-size:11px;font-weight:700">6</text>
<line class="a" x1="514" y1="530" x2="896" y2="530" style="" marker-end="url(#arr)"/>
<text class="v" x="705.0" y="523" text-anchor="middle">acknowledges: the device may free it</text>
<text class="n" x="20" y="604">The order is the rule: download → verify → store → acknowledge. A failure at any step stops before ⑥,</text>
<text class="n" x="20" y="622">so the device never frees a ride the app does not hold, verified. Code: lib/sync.ts; verification inside each driver.</text>
<text class="n" x="20" y="640">Simplified: progress messages and the Bryton USB path (same order, files instead of BLE frames) are not shown.</text>
</svg>
