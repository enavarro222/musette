<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 930" width="1040" role="img" aria-labelledby="title">
<title id="title">Musette architecture: one TypeScript app, one door to the Rust core</title>
<style>
  svg { --bg:#ffffff; --ink:#15171a; --muted:#5e636b; --line:#9aa0a6; --zone:#f4f5f2; --box:#ffffff; --accent:#0b6e69; --shared:#c2701f; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
