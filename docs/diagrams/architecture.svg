  .zl { fill: var(--muted); font-size: 13px; font-weight: 600; }
  .t { fill: var(--ink); font-size: 14px; font-weight: 600; }
  .s { fill: var(--muted); font-size: 11.5px; }
  .v { fill: var(--accent); font-size: 11.5px; font-weight: 600; }
  .sl { fill: var(--shared); font-size: 12px; font-weight: 600; }
  .n { fill: var(--muted); font-size: 12px; }
  .a { stroke: var(--accent); stroke-width: 1.6; fill: none; marker-end: url(#arr); }
  .ad { stroke: var(--shared); stroke-width: 1.6; fill: none; marker-end: url(#arrs); stroke-dasharray: 5 3; }
  .h { fill: var(--accent); }
  .hs { fill: var(--shared); }
</style>
