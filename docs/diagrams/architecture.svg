<text class="n" x="20" y="904">Arrows point from the caller to the callee, labelled with what the caller does. One box per folder: files are not shown.</text>
<text class="n" x="20" y="922">Platform differences live in sibling files (x.web.ts, x.ts / x.native.ts), never in Platform.OS checks spread through screens.</text>
