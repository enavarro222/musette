  .bg { fill: var(--bg); }
  .zone { fill: var(--zone); stroke: var(--line); stroke-width: 1; }
  .sub { fill: none; stroke: var(--line); stroke-dasharray: 4 3; }
  .shared { fill: none; stroke: var(--shared); stroke-width: 1.5; stroke-dasharray: 6 3; }
  .box { fill: var(--box); stroke: var(--line); }
  .key { fill: var(--box); stroke: var(--accent); stroke-width: 2; }
