name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # Crates shared with the firmware: they must build for an MCU.
      - run: cargo build -p protocol-cc600 -p route-cc600 -p settings-cc600 --target thumbv7em-none-eabihf

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # Must match the wasm-bindgen version in Cargo.lock.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: app
        run: |
          npm ci
          npm run wasm
          npm run check
          npm test
          MUSETTE_BASE_URL=/musette npm run build
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: app/dist

  # The TypeScript API of the Rust core for iOS/Android is generated from
  # crates/musette-ffi and committed: regenerate it, it must not change.
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: app
        run: |
          npm ci
          npm --prefix modules/musette-native run generate:android
          git diff --exit-code -- modules/musette-native/src

  # Publish the web app on GitHub Pages (enable Pages > Source: GitHub Actions).
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [rust, app, native]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
